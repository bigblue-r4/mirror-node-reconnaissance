[workspace]
resolver = "2"
members = [
    "core/ledger",
    "harness/agent",
    "lifecycle/reaper",
    "sim/mock-swarm",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["SGAIL LLC"]
repository = "https://github.com/SGAIL/mirror-node-reconnaissance"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

# internal crates
mnr-ledger = { path = "core/ledger" }
mnr-observer = { path = "harness/agent" }
mnr-reaper = { path = "lifecycle/reaper" }
mnr-sim = { path = "sim/mock-swarm" }

[profile.release]
opt-level = 3
lto = "thin"
