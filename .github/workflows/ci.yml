name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned, not `stable`: a new stable release must not change what this job
      # reports without a commit that says so.
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: The installed compiler matches rust-toolchain.toml
        run: |
          want=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          got=$(rustc --version | cut -d' ' -f2)
          echo "rust-toolchain.toml pins $want; rustc is $got"
          test "$want" = "$got"
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  verifier:
    name: independent verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Standard library only: no pip, no BLAKE3 package, no lockfile to pin.
      # This is the third implementation, so it must not share code with the
      # producer it checks.
      - name: The committed bundles verify against the spec, not the producer
        run: python3 -m unittest discover -s tools/bundle-verify -t tools/bundle-verify -q

  aggregation:
    name: aggregation verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build the mnr binary
        run: cargo build -p mnr-cli
      - name: Aggregation verifies, and a tampered probe breaks it
        run: scripts/ci/sparkle-tamper.sh
